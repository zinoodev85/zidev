# zidev tmux config (own socket: tmux -L zidev). Reloaded on every `zidev` attach.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
set -g extended-keys on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
# no tab bar: one tab fills the window, the sidebar lists them
set -g status off
set -as terminal-features ",*:hyperlinks"
set -g renumber-windows on
set -g detach-on-destroy off
set -g window-size latest
setw -g aggressive-resize on

set -g pane-border-lines single
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour237

# ctrl-q: zidev menu (ctrl-q again: next pane), file clicks: set by zidev (install_tmux_hooks)

# mouse selection goes to the macOS clipboard
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
